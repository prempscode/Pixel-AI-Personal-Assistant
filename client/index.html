<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pixel is a personal AI assistant that turns plain language into real action across Google Calendar, Gmail, Tasks and Drive."
    />
    <meta name="theme-color" content="#0a0b09" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pixel-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta property="og:title" content="Pixel — Consider it handled." />
    <meta
      property="og:description"
      content="One sentence becomes a scheduled meeting, a finished to-do, a drafted email, or the file you were looking for."
    />
    <meta property="og:type" content="website" />
    <title>Pixel — Consider it handled.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
