<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta
      name="description"
      content="Pixel turns plain-language requests into real actions in your Google account: Tasks, Calendar, Gmail and Drive."
    />
    <title>Pixel: say it, and it's done</title>
    <script>
      try {
        const theme = localStorage.getItem("pixel-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "light" ? "#f4f0e6" : "#0a0b09");
        }
      } catch {
        // The default dark theme remains available when storage is disabled.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
